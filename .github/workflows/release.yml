name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  dist:
    name: Electron ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows NSIS + portable
            cmd: dist:win
          - os: macos-latest
            name: macOS DMG
            cmd: dist:mac
          - os: ubuntu-latest
            name: Linux AppImage + deb + rpm
            cmd: dist:linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Linux packagers (rpm / fakeroot)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot

      - run: npm ci

      - name: Build Electron installers
        run: npm run ${{ matrix.cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Electron dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ihate-pdf-electron-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
            dist/latest*.yaml

      - name: Publish Electron GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
            dist/latest*.yaml

  tauri:
    name: Tauri ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows NSIS
            bundles: nsis
          - os: macos-latest
            name: macOS DMG
            bundles: dmg
          - os: ubuntu-22.04
            name: Linux AppImage + deb + rpm
            bundles: appimage,deb,rpm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux webkit + packagers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev rpm fakeroot

      - run: npm ci

      - name: Build Tauri installers
        run: npx tauri build --bundles ${{ matrix.bundles }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true

      - name: Collect stable artifact names
        run: node scripts/collect-tauri-artifacts.mjs

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ihate-pdf-tauri-${{ matrix.os }}
          if-no-files-found: error
          path: dist-tauri/*

      - name: Publish Tauri GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist-tauri/*
