appId: com.lovepdf.studio
productName: LovePDF Studio
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.ts'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js}'
  - '!scripts/*'
  - '!*.md'
extraResources:
  - from: resources/worker.py
    to: worker.py
  - from: resources/extract.py
    to: extract.py
  - from: resources/bin
    to: bin
linux:
  target:
    - dir
  icon: build/icon.png
  category: Office
win:
  icon: build/icon.png
mac:
  icon: build/icon.png
