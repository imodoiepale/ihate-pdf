appId: com.ihatepdf.app
productName: i hate pdf
executableName: ihate-pdf
copyright: Copyright © 2026 James Epale
artifactName: ihate-pdf-${version}-${os}-${arch}.${ext}
compression: normal
npmRebuild: false

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - package.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!src-tauri/**'
  - '!docs/*'
  - '!resources/*'
  - '!mcp/*'
  - '!scripts/*'
  - '!*.md'
  - '!electron.vite.config.ts'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{tailwind.config.js,postcss.config.js}'
  - '!.github/**'
  - '!.env*'
  - '!build/*'
  - '!agent-tools/*'

extraResources:
  - from: resources/worker.py
    to: worker.py
  - from: resources/extract.py
    to: extract.py
  - from: resources/requirements-extract.txt
    to: requirements-extract.txt
  - from: resources/bin
    to: bin
  - from: mcp
    to: mcp
  - from: build/icon.png
    to: icon.png

publish:
  provider: github
  owner: imodoiepale
  repo: ihate-pdf
  releaseType: release

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: i hate pdf
  uninstallDisplayName: i hate pdf
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: ihate-pdf-${version}-win-${arch}-setup.${ext}
  include: installer.nsh

portable:
  artifactName: ihate-pdf-${version}-win-${arch}-portable.${ext}
  requestExecutionLevel: user

mac:
  icon: build/icon.png
  category: public.app-category.productivity
  artifactName: ihate-pdf-${version}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - universal
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false

dmg:
  title: i hate pdf
  artifactName: ihate-pdf-${version}-mac-${arch}.${ext}
  writeUpdateInfo: false

linux:
  icon: build/icons
  category: Office
  synopsis: Local-first desktop PDF studio
  description: Merge, split, extract, and analyze PDFs on this computer. No upload, no accounts.
  maintainer: James Epale <ijepale@gmail.com>
  vendor: James Epale
  executableName: ihate-pdf
  syncDesktopName: true
  desktop:
    entry:
      Name: i hate pdf
      Comment: Local-first desktop PDF studio
      Keywords: pdf;merge;split;compress;
      Categories: Office;Graphics;Viewer;
      StartupWMClass: ihate-pdf
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64

deb:
  depends:
    - qpdf
    - poppler-utils
    - python3

rpm:
  depends:
    - qpdf
    - poppler-utils
    - python3
