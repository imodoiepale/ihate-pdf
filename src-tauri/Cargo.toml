[package]
name = "ihate-pdf"
version = "1.2.0"
description = "i hate pdf — local-first desktop PDF studio"
authors = ["James Epale <ijepale@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
